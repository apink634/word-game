<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Word Chain{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}">Word Chain</a>
    <nav aria-label="Main">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('play.play') }}">Play</a>
        <a href="{{ url_for('play.dashboard') }}">My history</a>
        <a href="{{ url_for('auth.account') }}">Account</a>
        <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Log in</a>
        <a href="{{ url_for('auth.signup') }}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main id="main">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<p class="flash" role="status">{{ message }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
